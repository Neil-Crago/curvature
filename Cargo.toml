[package]
name = "curvature"
authors = ["Neil Crago"]
version = "0.1.4"
edition = "2024"
description = "Curvature estimation, resonance analysis, and signal fusion primitives for sparse or noisy data."
license = "MIT"
repository = "https://github.com/NeilCrago/curvature"
homepage = "https://github.com/NeilCrago/curvature"
readme = "README.md"
keywords = ["mathematics", "curvature", "signal-processing", "wavelet", "resonance"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/curvature"
rust-version = "1.85"

[dependencies]
coheron = "0.1.5"
ndarray = "0.15.6"
omni-wave = "0.2.1"
rand = "0.10.1"
